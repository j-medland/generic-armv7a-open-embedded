#@TYPE: Machine
#@NAME: generic-armv7a
#@DESCRIPTION: Generic ARMv7-A target, VFP unit present, soft-float (EABI) ABI.
#@              Not tied to a specific board -- intended for building a
#@              rootfs + ipk package feed that is portable across ARMv7-A
#@              boards using the soft-float userspace ABI.

require conf/machine/include/arm/arch-armv7a.inc

# armv7a-vfp = ARMv7-A instructions + VFP unit used for FP math,
# but the *calling convention* stays soft-float (gnueabi), i.e. FP
# args are still passed in integer registers.
# NOTE: oe-core's tune is simply named "armv7a" -- it already bundles
# the VFP feature (TUNE_FEATURES_tune-armv7a = "arm armv7a vfp") while
# keeping the soft-float ABI. The hard-float sibling is "armv7ahf".
# There is no separate "armv7a-vfp" tune name; don't use that.
DEFAULTTUNE ?= "armv7a"

MACHINE_FEATURES = "usbhost ext2 vfat alsa rtc"

KERNEL_IMAGETYPE ?= "zImage"
IMAGE_FSTYPES ?= "tar.bz2"

SERIAL_CONSOLES ?= "115200;ttyS0"

MACHINE_EXTRA_RRECOMMENDS = "kernel-modules"

# No board-specific kernel/bootloader recipes are pulled in here on
# purpose -- this machine exists to produce a generic rootfs + package
# feed. Point PREFERRED_PROVIDER_virtual/kernel at your real kernel
# recipe (or add a linux-yocto bbappend) once you target real hardware.
