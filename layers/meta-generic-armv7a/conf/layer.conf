# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "generic-armv7a"
BBFILE_PATTERN_generic-armv7a = "^${LAYERDIR}/"
BBFILE_PRIORITY_generic-armv7a = "6"

LAYERSERIES_COMPAT_generic-armv7a = "warrior"
